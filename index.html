<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atyab 3rnous Menu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="splash-overlay" aria-hidden="true">
      <img src="assets/logo.png" alt="Atyab 3rnous logo" />
    </div>
    <header class="hero" id="top">
      <nav class="topbar" aria-label="Primary">
        <a class="brand" href="#top" aria-label="Atyab 3rnous home">
          
          <span>
            <strong>Atyab 3rnous</strong>
            <small data-i18n="tagline">Corn, foul, tormos and more</small>
          </span>
        </a>
        <div class="top-actions">
          <a class="icon-button phone-icon" href="tel:+96176808636" aria-label="Call Atyab 3rnous">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.2 14.2l-2.6-1.1a1 1 0 0 0-1 .2l-1.3 1.3a13.03 13.03 0 0 1-5.1-5.1l1.3-1.3a1 1 0 0 0 .2-1L9.8 6.8a1 1 0 0 0-1-.6H5.5A1.5 1.5 0 0 0 4 7.7a17 17 0 0 0 17 17 1.5 1.5 0 0 0 1.4-1.5v-3.3a1 1 0 0 0-.6-1z" />
            </svg>
          </a>
        </div>
      </nav>

      <div class="hero-grid">
        <section class="hero-copy" aria-labelledby="heroTitle">
          <p class="eyebrow" data-i18n="eyebrow">Fresh street boxes</p>
          <h1 id="heroTitle">Atyab 3rnous</h1>
          <p data-i18n="heroText">Choose your box, tap for details, and call to order. Built from the official menu artwork.</p>
          <div class="hero-address">
            <div class="hero-address-item">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="location-icon">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
              </svg>
              <a href="https://maps.app.goo.gl/xWtZ4xYMYYF6mWJH8" target="_blank" rel="noopener">Oscar Mall</a>
            </div>
            <div class="hero-address-item">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="location-icon">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
              </svg>
              <a href="https://maps.app.goo.gl/JH1Tqka3Gteqy66Y9" target="_blank" rel="noopener">Spot Mall Saida</a>
            </div>
            <div class="hero-address-item">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="location-icon">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
              </svg>
              <a href="https://maps.app.goo.gl/NX2TqucMTMVrb62b8?g_st=iwb" target="_blank" rel="noopener">al Mare</a>
            </div>
          </div>
          <div class="hero-actions">
            <a class="primary-action" href="#menu" data-i18n="viewMenu">View menu</a>

          </div>
        </section>
        <div class="hero-media" aria-hidden="true">
          <img src="assets/3cdaaa415435428dbd662487a80f9c80.png" alt="" />
        </div>
      </div>
    </header>

    <main id="menu">
      <section class="menu-shell" aria-label="Restaurant menu">
        <div class="menu-head">
          <div>
            <p class="eyebrow" data-i18n="menuEyebrow">Digital menu</p>
            <h2 data-i18n="menuTitle">Pick a category</h2>
          </div>
          <label class="search-box">
            <span data-i18n="searchLabel">Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Search menu" />
          </label>
        </div>

        <div class="category-strip" id="categoryStrip" aria-label="Menu categories"></div>
        <div class="menu-list" id="menuGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Atyab 3rnous</p>
      <a class="footer-whatsapp" href="tel:+96176808636" aria-label="Call Atyab 3rnous">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.2 14.2l-2.6-1.1a1 1 0 0 0-1 .2l-1.3 1.3a13.03 13.03 0 0 1-5.1-5.1l1.3-1.3a1 1 0 0 0 .2-1L9.8 6.8a1 1 0 0 0-1-.6H5.5A1.5 1.5 0 0 0 4 7.7a17 17 0 0 0 17 17 1.5 1.5 0 0 0 1.4-1.5v-3.3a1 1 0 0 0-.6-1z" />
        </svg>
      </a>
      <a href="assets/atyab%203arnous%20menu%20ar%20and%20eng%20newww.pdf" target="_blank" data-i18n="pdfMenu">PDF menu</a>
    </footer>

    <dialog class="item-dialog" id="itemDialog">
      <button class="close-dialog" type="button" id="closeDialog" aria-label="Close">&times;</button>
      <img id="dialogImage" alt="" />
      <div class="dialog-body">
        <p class="item-category" id="dialogCategory"></p>
        <h3 id="dialogTitle"></h3>
        <p id="dialogDescription"></p>
        <div class="dialog-actions">
          <button class="secondary-action" type="button" id="dialogCloseText" data-i18n="backMenu">Back to menu</button>
        </div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
